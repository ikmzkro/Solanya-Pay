<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solanya Pay</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .demo {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      padding: 40px 48px;
      width: 420px;
      box-shadow: 0 0 40px rgba(153, 69, 255, 0.35);
      position: relative;
      margin-top: 40px;
    }

    /* cat ears */
    .demo::before,
    .demo::after {
      content: '';
      position: absolute;
      top: -38px;
      width: 0;
      height: 0;
      border-left: 34px solid transparent;
      border-right: 34px solid transparent;
      border-bottom: 44px solid #0f3460;
    }
    .demo::before { left: 36px; transform: rotate(-12deg); }
    .demo::after  { right: 36px; transform: rotate(12deg); }

    .logo {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 8px;
      animation: nod 3s ease-in-out infinite;
    }

    @keyframes nod {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-8deg); }
    }

    .tagline {
      text-align: center;
      font-size: 0.72rem;
      color: #888;
      margin: -24px 0 28px;
    }

    #qr-wrapper { position: relative; }

    /* cat in the middle of the QR code */
    .qr-cat {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
      padding: 4px;
    }

    /* dancing cat while waiting for the payment */
    .dancer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin-top: 20px;
      height: 76px;
    }

    .dance-cat {
      width: 60px;
      height: 60px;
      animation: dance 0.8s ease-in-out infinite;
    }

    @keyframes dance {
      0%   { transform: translateY(0) rotate(-14deg); }
      25%  { transform: translateY(-16px) rotate(0deg) scale(1.08, 0.94); }
      50%  { transform: translateY(0) rotate(14deg); }
      75%  { transform: translateY(-16px) rotate(0deg) scale(1.08, 0.94); }
      100% { transform: translateY(0) rotate(-14deg); }
    }

    .note {
      color: #14F195;
      font-size: 1.2rem;
      animation: float 1.6s ease-in-out infinite;
    }
    .note:last-child { color: #9945FF; animation-delay: 0.8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-20px); opacity: 1; }
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: #e0e0e0;
      margin-top: 6px;
    }

    /* scanned: the cat waits politely */
    .dancer.scanned .dance-cat { animation: wait 1.2s ease-in-out infinite; }
    @keyframes wait {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(6deg); }
    }

    /* success screen */
    #success-view { text-align: center; }

    .success-cat {
      width: 120px;
      height: 120px;
      margin-top: 8px;
      animation: jump 0.9s ease-in-out infinite;
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      40%      { transform: translateY(-24px) scale(1.05) rotate(-6deg); }
      60%      { transform: translateY(-24px) scale(1.05) rotate(6deg); }
    }

    .success-title {
      font-size: 1.3rem;
      color: #14F195;
      margin-top: 16px;
    }

    .success-amount {
      font-size: 2rem;
      color: #e0e0e0;
      margin-top: 12px;
    }

    .success-amount small { font-size: 0.9rem; color: #888; }

    .explorer-link {
      display: block;
      margin-top: 6px;
      color: #a0c4ff;
      font-size: 0.8rem;
      word-break: break-all;
    }

    .paws {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 20px;
      opacity: 0.5;
      letter-spacing: 0.6em;
    }

    h1 {
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: #14F195;
      margin-bottom: 32px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 0.1em;
    }

    .field input {
      width: 100%;
      background: #0d1b2a;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 1.4rem;
      padding: 10px 14px;
      outline: none;
      text-align: right;
    }

    .field input:focus { border-color: #a0c4ff; }

    .unit {
      text-align: right;
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
    }

    button {
      margin-top: 24px;
      width: 100%;
      background: #0f3460;
      border: none;
      border-radius: 6px;
      color: #a0c4ff;
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      padding: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #1a4a80; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }

    #result { margin-top: 32px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
    }

    .info-row span:last-child { color: #e0e0e0; }

    #qr-wrapper {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      background: #fff;
      border-radius: 8px;
      padding: 16px;
    }

    #qr-canvas { display: block; }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: #666;
      margin-top: 10px;
    }

    .url-row {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .url-row input {
      flex: 1;
      background: #0d1b2a;
      border: 1px solid #0f3460;
      border-radius: 4px;
      color: #666;
      font-family: inherit;
      font-size: 0.65rem;
      padding: 6px 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .url-row button {
      margin-top: 0;
      width: auto;
      padding: 6px 12px;
      font-size: 0.7rem;
    }

    .error {
      color: #ff6b6b;
      font-size: 0.8rem;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="demo">
    <img class="logo" src="/icon.svg" alt="Solanya Pay の猫">
    <h1>Solanya Pay</h1>
    <p class="tagline">USDC を送るにゃ</p>

    <div id="pay-view">
    <div class="field">
      <label>送金金額（にゃん）</label>
      <input id="usdc" type="number" value="1" min="0.01" step="0.01">
      <div class="unit">USDC</div>
    </div>

    <button id="btn" onclick="requestQR()">🐾 QR コードを生成にゃ</button>

    <div id="result" style="display:none">
      <div class="info-row">
        <span>送金 USDC</span>
        <span id="usdc-val"></span>
      </div>
      <div id="qr-wrapper">
        <div id="qr-canvas"></div>
        <img class="qr-cat" src="/icon.svg" alt="">
      </div>
      <div id="dancer" class="dancer">
        <span class="note">♪</span>
        <img class="dance-cat" src="/icon.svg" alt="踊る猫">
        <span class="note">♫</span>
      </div>
      <p id="status-text" class="status">QR を読み取ってにゃ♪</p>
      <p class="hint">Phantom モバイルで QR をスキャンしてにゃ</p>
      <div class="url-row">
        <input id="solana-url" type="text" readonly>
        <button onclick="copyUrl()">コピー</button>
      </div>
    </div>
    </div>

    <div id="success-view" style="display:none">
      <img class="success-cat" src="/icon.svg" alt="喜ぶ猫">
      <p class="success-title">送金できました！🎉</p>
      <p class="success-amount"><span id="success-amount"></span> <small>USDC</small></p>
      <p class="hint">Solana Explorer で取引を見る</p>
      <a id="explorer-link" class="explorer-link" target="_blank" rel="noopener"></a>
      <button onclick="resetPayment()">🐾 もう一度送るにゃ</button>
    </div>

    <p id="error" class="error" style="display:none"></p>
    <p class="paws">🐾🐾🐾</p>
  </div>

  <script>
    let qrInstance = null;
    let pollTimer = null;

    const POLL_INTERVAL_MS = 2000;
    const POLL_TIMEOUT_MS = 5 * 60 * 1000;
    const EXPLORER_CLUSTER = 'devnet';

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    // Poll the server until the payment is confirmed on-chain
    function startPolling(reference) {
      stopPolling();
      const startedAt = Date.now();
      pollTimer = setInterval(async () => {
        if (Date.now() - startedAt > POLL_TIMEOUT_MS) {
          stopPolling();
          showStatus('時間切れにゃ… QR を作り直してね', false);
          return;
        }
        try {
          const res = await fetch(`/payment/${reference}/status`);
          if (!res.ok) return; // keep polling; transient RPC errors are logged on the server
          const data = await res.json();
          if (data.status === 'scanned') showStatus('ウォレットで承認してにゃ…', true);
          if (data.status === 'paid') {
            stopPolling();
            showSuccess(data);
          }
        } catch (e) {
          console.warn('status check failed', e);
        }
      }, POLL_INTERVAL_MS);
    }

    function showStatus(text, scanned) {
      document.getElementById('status-text').textContent = text;
      document.getElementById('dancer').classList.toggle('scanned', scanned);
    }

    function showSuccess(data) {
      document.getElementById('success-amount').textContent = data.usdc_amount;
      const link = document.getElementById('explorer-link');
      const url = `https://explorer.solana.com/tx/${data.signature}?cluster=${EXPLORER_CLUSTER}`;
      link.href = url;
      link.textContent = url;
      document.getElementById('pay-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
    }

    function resetPayment() {
      stopPolling();
      document.getElementById('success-view').style.display = 'none';
      document.getElementById('result').style.display = 'none';
      document.getElementById('pay-view').style.display = 'block';
    }

    function copyUrl() {
      const el = document.getElementById('solana-url');
      navigator.clipboard.writeText(el.value).then(() => {
        const btn = el.nextElementSibling;
        btn.textContent = 'にゃ！';
        setTimeout(() => { btn.textContent = 'コピー'; }, 1500);
      });
    }

    async function requestQR() {
      const usdc = parseFloat(document.getElementById('usdc').value);
      if (!usdc || usdc <= 0) return;
      stopPolling();

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'ねこ考え中...';

      document.getElementById('result').style.display = 'none';
      document.getElementById('error').style.display = 'none';

      try {
        const res = await fetch('/payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usdc_amount: usdc }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error ?? `HTTP ${res.status}`);
        }

        // Decode the solana: URL
        const solanaUrl = decodeURIComponent(data.qr_url.replace(/^solana:/, ''));
        // The QR code encodes the original solana:... URL
        const qrContent = data.qr_url;

        document.getElementById('usdc-val').textContent = `${data.usdc_amount} USDC`;

        const container = document.getElementById('qr-canvas');
        container.innerHTML = '';

        if (qrInstance) {
          qrInstance.clear();
          qrInstance = null;
        }

        qrInstance = new QRCode(container, {
          text: qrContent,
          width: 240,
          height: 240,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H,
        });

        document.getElementById('solana-url').value = qrContent;
        showStatus('QR を読み取ってにゃ♪', false);
        document.getElementById('result').style.display = 'block';
        startPolling(data.reference);

      } catch (e) {
        document.getElementById('error').textContent = 'にゃっ…エラー: ' + e.message;
        document.getElementById('error').style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '🐾 QR コードを生成にゃ';
      }
    }
  </script>
</body>
</html>
